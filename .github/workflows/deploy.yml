name: Deploy static content to Pages

on:
  # Roda a action toda vez que houver um push na branch main ou master
  push:
    branches: ["main", "master"]
  
  # Permite que você dispare o deploy manualmente via aba Actions
  workflow_dispatch:

# Permissões necessárias para permitir o deploy seguro por token para o GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Garante que apenas um deploy seja executado por vez
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4
        
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          
      - name: Instalar dependências
        run: npm install
        
      - name: Build do projeto Vite
        run: npm run build
        
      - name: Configurar uso do Pages
        uses: actions/configure-pages@v4
        
      - name: Upload dos artefatos (dist)
        uses: actions/upload-pages-artifact@v3
        with:
          # Pasta onde o Vite e o Build final salvaram os arquivos estáticos:
          path: './dist'
          
      - name: Deploy final no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
